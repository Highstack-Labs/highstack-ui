@if (label()) {
  <ui-label [for]="id()" [required]="required()">{{ label() }}</ui-label>
}

<div class="relative">
  <button
    type="button"
    [id]="id()"
    data-trigger
    [class]="triggerClasses()"
    [disabled]="isDisabled()"
    [attr.aria-haspopup]="'listbox'"
    [attr.aria-expanded]="open()"
    [attr.aria-invalid]="hasError() || null"
    [attr.aria-describedby]="describedById()"
    (click)="toggle()"
  >
    <span [class]="selectedLabel() ? 'text-[var(--color-foreground)]' : 'text-[var(--color-muted-foreground)]'" class="truncate">
      {{ selectedLabel() || placeholder() }}
    </span>
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      class="shrink-0 text-[var(--color-muted-foreground)] transition-transform"
      [class.rotate-180]="open()"
    >
      <path d="m6 9 6 6 6-6" />
    </svg>
  </button>

  <!--
    El panel está portalizado a nivel de <body> (uiOverlayPortal) para que no lo
    recorte ni lo reposicione ningún ancestro con transform/overflow. Por eso el
    (keydown) va aquí y no en el host: con el foco dentro del panel, un
    @HostListener del host ya no recibiría las teclas.
  -->
  <div
    #panel
    uiOverlayPortal
    role="listbox"
    tabindex="-1"
    (keydown)="onPanelKeydown($event)"
    class="fixed max-h-60 overflow-y-auto rounded-[var(--radius)] border border-[var(--color-border)] bg-[var(--color-background)] p-1 shadow-md transition-opacity duration-100 outline-none"
    [class.hidden]="!open()"
    [class.opacity-0]="!ready()"
    [style.pointerEvents]="ready() ? 'auto' : 'none'"
  >
    <ng-content />
  </div>
</div>

@if (errorMessage()) {
  <p [id]="describedById()" class="mt-1.5 text-xs text-[var(--color-destructive)]">{{ errorMessage() }}</p>
} @else if (hint()) {
  <p [id]="describedById()" class="mt-1.5 text-xs text-[var(--color-muted-foreground)]">{{ hint() }}</p>
}
