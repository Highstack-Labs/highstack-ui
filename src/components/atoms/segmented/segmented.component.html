<div
  role="radiogroup"
  [id]="id()"
  [class]="trackClasses()"
  [attr.aria-required]="required() || null"
  [attr.aria-invalid]="hasError() || null"
  [attr.aria-describedby]="describedById()"
>
  @for (option of options(); track option.value) {
    <button
      type="button"
      role="radio"
      [class]="segmentClasses(option)"
      [attr.aria-checked]="value() === option.value"
      [disabled]="isOptionDisabled(option)"
      (click)="select(option)"
    >
      @if (option.icon) {
        <span class="shrink-0 inline-flex items-center" [innerHTML]="safeIcon(option.icon)"></span>
      }
      {{ option.label }}
    </button>
  }
</div>

@if (errorMessage()) {
  <p [id]="describedById()" class="mt-1.5 text-xs text-[var(--color-destructive)]">{{ errorMessage() }}</p>
} @else if (hint()) {
  <p [id]="describedById()" class="mt-1.5 text-xs text-[var(--color-muted-foreground)]">{{ hint() }}</p>
}
