<ui-input
  [id]="id()"
  [name]="name()"
  [label]="label()"
  [hint]="hint()"
  [error]="resolvedError()"
  [placeholder]="placeholder()"
  [size]="size()"
  [disabled]="isDisabled()"
  [readonly]="readonly()"
  [required]="required()"
  [value]="text()"
  (valueChange)="onTextInput($event)"
  (focusin)="onFocus()"
  (focusout)="onBlur()"
/>
