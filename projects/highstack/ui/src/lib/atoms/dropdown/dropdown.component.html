<ng-content select="[uiDropdownTrigger]" />

<!--
  El panel está portalizado a nivel de <body> (uiOverlayPortal) para que no lo
  recorte ni lo reposicione ningún ancestro con transform/overflow. Por eso el
  (keydown) va aquí y no en el host: con el foco dentro del panel, un
  @HostListener del host ya no recibiría las teclas.
-->
@if (open()) {
  <div
    #panel
    uiOverlayPortal
    role="menu"
    tabindex="-1"
    (keydown)="onPanelKeydown($event)"
    [class]="panelClasses()"
    [style.top.px]="panelTop()"
    [style.left.px]="panelLeft()"
  >
    <ng-content />
  </div>
}
